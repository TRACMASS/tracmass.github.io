      ! seed in box in range i = [ist1,ist2]
      !                      j = [jst1,jst2]
      !                      k = [kst1,kst2]

      !                box1,  box2,  box3
      ist1           = 285,   200,   400, 
      ist2           = 325,   250,   500,
      
      jst1           = 270,   150,   1,
      jst2           = 330,   170,   100,  
      
      kst1           = 1,     1,     10,
      kst2           = 1,     100,   20,  

      ! (1) seed only for specific times
      ! (2) seed using file with start positions
      seedtime       =  1, 
 
      ! (if seedtime=1) seed only between tst1 and tst2
      tst1           = 1,
      tst2           = 1,
 /</code></pre>

