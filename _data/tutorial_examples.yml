setup_grid_aviso_1: | 
 <pre class='highlight'><code>! dx and dy in u and v points & grid area
 DO jj = 1, jmt
    DO ii = 1, imt

       dx = dlon * deg * COS( (-90.+dlat*(jj-0.5))*radian )
       dy = dlat * deg

       dxv(ii,jj) = dlon * deg * COS( (-90.+dlat*jj)*radian )
       dyu(ii,jj) = dy

       dxdy(ii,jj) = dx * dy

    END DO
 END DO
 </code></pre>

